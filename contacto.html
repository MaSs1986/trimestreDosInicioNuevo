<!DOCTYPE html>
<html lang="es-mx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miguel Serrano CV</title>
</head>
<body>
    <header>
        <h1>Miguel Angel Serrano Suarez</h1>
        <h2>Estudiante del Sena - Sin especializacion</h2>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="experiencia.html">Experiencia</a></li>
                <li><a href="estudios.html">Estudios</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <img src="img/image1.png" alt="banner con el nombre de contacto y su logo" width="100%">
        <hr>
    </header>
    <main>
        <form action="datos.js">
        <table border="1">
        <thead>
            <tr>
                <th colspan="2">Formulario de Contacto</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nombre</td>
                <td><input type="text" name="nombre" required></td>
            </tr>
            <tr>
                <td>Correo</td>
                <td><input type="email" name="correo" required></td>
            </tr>
            <tr>
                <td>Ciudad</td>
                <td>
                    <select name="ciudad" required>
                    <option value="">Seleccione una ciudad</option>
                    <option value="Bogota">Bogota</option>
                    <option value="Medellin">Medellin</option>
                    <option value="Santa Marta">Santa Marta</option>
                    <option value="Barranquilla">Barranquilla</option>
                    <option value="Cartagena">Cartagena</option>
                    <option value="Cali">Cali</option>
                </select>
            </td>
            </tr>
            <tr>
                <td>Mensaje</td>
                <td><textarea name="mensaje" rows="4" required></textarea></td>
            </tr>
            <tr>
                <td>Sexo</td>
                <td>
                    <input type="radio" name="sexo" value="masculino"><label>Masculino</label> 
                    <input type="radio" name="sexo" value="femenino"><label>Femenino</label>
                </td>
            </tr>
            <tr>
                <td>Intereses</td>
                <td>
                    <input type="checkbox" name="intereses" value="Videojuegos"><label>Videojuegos</label>
                    <input type="checkbox" name="intereses" value="Estudiar"><label>Estudiar</label>
                    <input type="checkbox" name="intereses" value="Leer"><label>Leer</label>
                    <input type="checkbox" name="intereses" value="Musica"><label>Música</label>
                </td>
            <tr>
                <td></td>
                <td><button type="submit">Enviar</button></td>
            </tr>
        </table>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Miguel Angel Serrano Suarez. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
